# Production deployment (spec §14). TLS termination happens in front of
# arkivo-web and arkivo-mcp (reverse proxy not included here).
name: arkivo

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: arkivo
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkivo"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true" # not exposed outside the compose network
      OPENSEARCH_JAVA_OPTS: "-Xms4g -Xmx4g"
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  arkivo-web:
    image: arkivo:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["serve-web"]
    environment: &arkivo-env
      ARKIVO_DATABASE_URL: postgres://arkivo:${POSTGRES_PASSWORD}@postgres/arkivo
      ARKIVO_MAILDIR_ROOT: /data/mail
      ARKIVO_MASTER_KEY_PATH: /run/secrets/master_key
      ARKIVO_OPENSEARCH__URL: http://opensearch:9200
      ARKIVO_EMBEDDING__URL: ${OLLAMA_URL:?set in .env, e.g. http://host:11434}
      ARKIVO_WEB__BIND: 0.0.0.0:8080
      ARKIVO_WEB__RP_ID: ${RP_ID:?e.g. arkivo.example.com}
      ARKIVO_WEB__RP_ORIGIN: ${RP_ORIGIN:?e.g. https://arkivo.example.com}
      ARKIVO_MCP__BIND: 0.0.0.0:8081
      # Optional Gmail ingestion (OAuth client with gmail.readonly scope,
      # redirect URI ${RP_ORIGIN}/oauth/google/callback). Leave unset to
      # hide the "Connect Gmail" flow.
      ARKIVO_GOOGLE__CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ARKIVO_GOOGLE__CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional Microsoft 365 ingestion over Graph (Entra app registration with
      # delegated Mail.Read + User.Read + offline_access, redirect URI
      # ${RP_ORIGIN}/oauth/microsoft/callback). Leave unset to hide the
      # "Connect Microsoft 365" flow. TENANT: common | organizations |
      # consumers | a tenant id.
      ARKIVO_MICROSOFT__CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      ARKIVO_MICROSOFT__CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      ARKIVO_MICROSOFT__TENANT: ${MICROSOFT_TENANT:-common}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - maildir:/data/mail
    secrets:
      - master_key
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  arkivo-mcp:
    image: arkivo:latest
    restart: unless-stopped
    command: ["serve-mcp"]
    # No master_key secret: serve-mcp never unseals credentials (spec §16 —
    # the MCP server must not be able to reach the Fastmail token).
    environment: *arkivo-env
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  arkivo-worker:
    image: arkivo:latest
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/supercronic", "/etc/arkivo/crontab"]
    environment: *arkivo-env
    volumes:
      - maildir:/data/mail
    secrets:
      - master_key
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

secrets:
  master_key:
    file: ./secrets/master.key

volumes:
  pg-data:
  os-data:
  maildir:
