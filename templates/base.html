<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkivo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0; }
    th, td { text-align: left; padding: .3rem .6rem; border-bottom: 1px solid #ddd; font-size: .9rem; }
    input, select, button { font: inherit; padding: .35rem .5rem; margin: .15rem 0; }
    button { cursor: pointer; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
    .error { color: #b00020; } .ok { color: #087f23; }
    code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 3px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Arkivo</h1>
  {% block content %}{% endblock %}
  <script src="/static/app.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
