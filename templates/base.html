<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkivo</title>
  <style>
    /* Arkivo — calm, trustworthy admin surface for a self-hosted archive.
       Light theme, OKLCH palette tinted toward a slate-blue brand hue, a
       fixed rem type scale, and a 4pt spacing scale. No web fonts: a
       security appliance shouldn't fetch from a third-party CDN, so we
       build hierarchy from scale/weight/space on a refined system stack. */
    :root {
      color-scheme: light;

      --bg:        oklch(0.984 0.004 255);
      --surface:   oklch(0.997 0.002 255);
      --surface-2: oklch(0.965 0.005 255);
      --ink:       oklch(0.29 0.02 262);
      --ink-soft:  oklch(0.47 0.02 262);
      --ink-faint: oklch(0.60 0.015 262);
      --border:    oklch(0.905 0.008 262);
      --border-strong: oklch(0.83 0.012 262);

      --accent:       oklch(0.55 0.11 250);
      --accent-hover: oklch(0.47 0.11 250);
      --accent-ink:   oklch(0.99 0.01 250);
      --accent-tint:  oklch(0.95 0.024 250);

      --danger:       oklch(0.55 0.16 26);
      --danger-tint:  oklch(0.955 0.03 26);
      --success:      oklch(0.55 0.11 150);
      --success-tint: oklch(0.95 0.03 155);
      --warn-ink:     oklch(0.47 0.07 74);
      --warn-tint:    oklch(0.955 0.045 85);

      --space-2xs:.25rem; --space-xs:.5rem; --space-sm:.75rem;
      --space-md:1rem; --space-lg:1.5rem; --space-xl:2rem; --space-2xl:3rem;

      --text-xs:.78rem; --text-sm:.9rem; --text-base:1rem;
      --text-lg:1.15rem; --text-xl:1.4rem; --text-2xl:1.85rem;

      --radius:10px; --radius-sm:6px;
      --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --shadow: 0 1px 2px oklch(0.4 0.03 262 / .05), 0 4px 12px oklch(0.4 0.03 262 / .05);
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-ui);
      font-size: var(--text-base);
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 0 var(--space-lg) var(--space-2xl); }

    /* Masthead ------------------------------------------------------------ */
    .masthead {
      display: flex; align-items: baseline; gap: var(--space-md);
      max-width: 64rem; margin: 0 auto; padding: var(--space-lg) var(--space-lg) var(--space-md);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-xl);
    }
    .wordmark { font-size: var(--text-xl); font-weight: 650; letter-spacing: -0.02em; }
    .wordmark span { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 500;
      color: var(--ink-faint); letter-spacing: .04em; margin-left: .35rem; }
    .masthead-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-sm);
      font-size: var(--text-sm); color: var(--ink-soft); }

    /* Typography ---------------------------------------------------------- */
    h1 { font-size: var(--text-2xl); font-weight: 650; letter-spacing: -0.02em; margin: 0 0 var(--space-md); }
    h2 { font-size: var(--text-lg); font-weight: 620; letter-spacing: -0.01em; margin: 0; }
    h3 { font-size: var(--text-sm); font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
      color: var(--ink-soft); margin: var(--space-lg) 0 var(--space-xs); }
    p { margin: 0 0 var(--space-sm); }

    /* Sections & cards ---------------------------------------------------- */
    section { margin: 0 0 var(--space-xl); }
    .section-head { margin-bottom: var(--space-sm); }
    .section-head p { color: var(--ink-soft); font-size: var(--text-sm); max-width: 62ch; margin: var(--space-2xs) 0 0; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: var(--space-lg);
      display: flex; flex-direction: column; gap: var(--space-md);
    }
    .card--primary { box-shadow: var(--shadow); }

    /* Buttons — explicit hierarchy: primary / secondary / ghost / danger -- */
    .btn {
      font: inherit; font-size: var(--text-sm); line-height: 1; white-space: nowrap;
      padding: .5rem .8rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
      cursor: pointer; transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .btn:hover { background: var(--surface); border-color: var(--ink-faint); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 550; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: .5rem; }
    .btn-ghost:hover { background: var(--accent-tint); border-color: transparent; }
    .btn-danger { background: transparent; color: var(--danger);
      border-color: color-mix(in oklch, var(--danger) 32%, var(--border)); }
    .btn-danger:hover { background: var(--danger); color: var(--accent-ink); border-color: var(--danger); }
    .btn-sm { font-size: var(--text-xs); padding: .35rem .55rem; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }
    .actions .push { margin-left: auto; }

    /* Forms --------------------------------------------------------------- */
    input, select {
      font: inherit; font-size: var(--text-sm); padding: .5rem .6rem;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink); max-width: 100%;
    }
    input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    input::placeholder { color: var(--ink-faint); }
    .field-row { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
    label { font-size: var(--text-sm); color: var(--ink-soft); }

    /* Tables -------------------------------------------------------------- */
    table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
    thead th { text-align: left; font-weight: 600; font-size: var(--text-xs);
      text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint);
      padding: 0 .7rem .4rem; border-bottom: 1px solid var(--border); }
    tbody td { padding: .5rem .7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--surface-2); }

    /* Pills, banners, feedback ------------------------------------------- */
    .pill { display: inline-flex; align-items: center; gap: .35rem;
      font-size: var(--text-xs); font-weight: 550; padding: .15rem .5rem; border-radius: 999px;
      background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--border); }
    .pill::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; opacity: .8; }
    .pill-ok { color: var(--success); background: var(--success-tint); border-color: transparent; }
    .pill-warn { color: var(--warn-ink); background: var(--warn-tint); border-color: transparent; }
    .pill-danger { color: var(--danger); background: var(--danger-tint); border-color: transparent; }

    .banner { display: flex; gap: var(--space-sm); align-items: flex-start;
      padding: .75rem .9rem; border-radius: var(--radius-sm); font-size: var(--text-sm); }
    .banner-body { flex: 1; }
    .banner-title { font-weight: 600; margin: 0 0 .1rem; }
    .banner-detail { color: var(--ink-soft); margin: 0; }
    .banner-danger { background: var(--danger-tint); border: 1px solid color-mix(in oklch, var(--danger) 22%, transparent); }
    .banner-danger .banner-title { color: var(--danger); }
    .banner-warn { background: var(--warn-tint); border: 1px solid color-mix(in oklch, var(--warn-ink) 22%, transparent); }
    .banner-warn .banner-title { color: var(--warn-ink); }

    .hint { color: var(--ink-soft); font-size: var(--text-sm); margin: 0; }
    .feedback { min-height: 1.2rem; font-size: var(--text-sm); margin: 0; }
    .feedback.error { color: var(--danger); }
    .feedback.ok { color: var(--success); }
    .empty { color: var(--ink-faint); font-size: var(--text-sm); padding: var(--space-sm) 0; }

    code { font-family: var(--font-mono); font-size: .85em; background: var(--surface-2);
      padding: .12rem .35rem; border-radius: 4px; word-break: break-all; border: 1px solid var(--border); }
    .mono { font-family: var(--font-mono); font-size: .9em; }
    .muted { color: var(--ink-faint); }

    /* Problem messages (failed / quarantined) ----------------------------- */
    .problems { display: flex; flex-direction: column; gap: var(--space-sm);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: var(--space-sm) var(--space-md); background: var(--surface-2); }
    .problem-group + .problem-group { border-top: 1px solid var(--border); padding-top: var(--space-sm); }
    .problem-err { font-size: var(--text-sm); color: var(--ink-soft); word-break: break-word;
      margin: var(--space-2xs) 0 0; }
    .problem-err summary { cursor: pointer; }
    .err-full { white-space: pre-wrap; word-break: break-word;
      font-size: var(--text-xs); margin-top: var(--space-2xs); }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wordmark">Arkivo <span>archive</span></div>
    <div class="masthead-actions">{% block masthead_actions %}{% endblock %}</div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
