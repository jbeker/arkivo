[package]
name = "arkivo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.32"
hex = "0.4.3"
html2text = "0.17.1"
mail-parser = "0.11.4"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "http2", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "json"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["toml", "env", "test"] }
tempfile = "3.27.0"
